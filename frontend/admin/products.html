<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produtos | Backoffice St. George</title><link rel="stylesheet" href="/css/main.css"></head><body><div class="admin-shell"><aside class="admin-nav"><a class="brand" href="/admin">ST. <span>GEORGE</span></a><nav style="margin-top:35px"><a href="/admin">Visão geral</a><a href="/admin/products">Produtos</a><a href="/admin/news">Notícias</a></nav></aside><main class="admin-main"><p class="eyebrow">Conteúdo</p><h1>Produtos</h1><form id="new-product-form" class="card" style="margin-top:25px"><h3>Novo produto</h3><div class="form-grid" style="margin-top:18px"><label class="field">Nome<input name="name" required minlength="2"></label><label class="field">Slug<input name="slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*" placeholder="nome-do-produto"></label><label class="field field--wide">Resumo<input name="summary" required minlength="10" maxlength="280"></label><label class="field field--wide">Descrição<textarea name="description" required minlength="10"></textarea></label><label class="field">Categoria<input name="category"></label><label class="field">Estado<select name="status"><option value="DRAFT">Rascunho</option><option value="PUBLISHED">Publicado</option></select></label></div><button class="button" type="submit" style="margin-top:20px">Guardar produto</button><p class="status" id="admin-status" aria-live="polite"></p></form></main></div><script type="module" src="/js/admin/admin.js"></script></body></html>
