<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contactos | St. George</title><link rel="stylesheet" href="/css/main.css"></head><body data-page="/contact-us"><div data-header></div><main><section class="page-hero"><div class="container"><p class="eyebrow">Estamos disponíveis</p><h1>Fale connosco</h1><p>Envie-nos a sua mensagem. A equipa St. George entrará em contacto assim que possível.</p></div></section><section class="page-content"><div class="container split"><div><h2>Vamos conversar</h2><p class="lead" style="margin-top:18px">Para informações institucionais, comerciais ou oportunidades de parceria, utilize este canal.</p><p style="margin-top:35px"><strong>Luanda, Angola</strong><br><a href="mailto:geral@stgeorge.co.ao">geral@stgeorge.co.ao</a></p></div><form id="contact-form" class="card" novalidate><div class="form-grid"><label class="field">Nome<input name="name" autocomplete="name" required minlength="2"></label><label class="field">E-mail<input name="email" type="email" autocomplete="email" required></label><label class="field">Telefone<input name="phone" type="tel" autocomplete="tel"></label><label class="field">Assunto<input name="subject"></label><label class="field field--wide">Mensagem<textarea name="message" required minlength="10"></textarea></label></div><button class="button" type="submit" style="margin-top:20px">Enviar mensagem</button><p id="form-status" class="status" aria-live="polite"></p></form></div></section></main><div data-footer></div><button class="back-top" aria-label="Voltar ao topo">↑</button><a class="floating-chat" href="/contact-us" aria-label="Enviar mensagem">✦</a><script type="module" src="/js/main.js"></script><script type="module" src="/js/modules/contact/contact-form.js"></script></body></html>
